<svg xmlns="http://www.w3.org/2000/svg" viewBox="300 0 600 400" width="100%" role="img" aria-label="Alex in der Mitte, drumherum kreisen Homeserver, ESP32, Katzenpfote, Lötkolben, Tastatur und ein Docker-Wal.">
<defs><radialGradient id="g"><stop offset="0" stop-color="#0284c7" stop-opacity=".18"/><stop offset="1" stop-color="#0284c7" stop-opacity="0"/></radialGradient></defs>
<style>
.ic{fill:none;stroke:#0f172a;stroke-width:2;stroke-linejoin:round}
