<g font-family="Inter,'Segoe UI',system-ui,sans-serif" text-anchor="middle">
<text class="lb" x="600" y="118" font-size="13" font-weight="600" letter-spacing="6" fill="#64748b">HI, ICH BIN</text>
<text class="nm" x="600" y="210" font-size="96" font-weight="800" fill="url(#nm)">Alex</text>
<text class="ty ty0" x="600" y="283" text-anchor="middle" clip-path="url(#c0)">Läuft auf meinem Server. Meistens.</text><text class="ty ty1" x="600" y="283" text-anchor="middle" clip-path="url(#c1)">Hat einen Türsteher für den eigenen Code.</text><text class="ty ty2" x="600" y="283" text-anchor="middle" clip-path="url(#c2)">Hat 4 RAM-Slots. Einer streikt. Wir reden nicht darüber.</text><text class="ty ty3" x="600" y="283" text-anchor="middle" clip-path="url(#c3)">Erst brechen, dann verstehen.</text><text class="ty ty4" x="600" y="283" text-anchor="middle" clip-path="url(#c4)">Lokale KI. Cloud ist auch nur der Rechner von jemand anderem.</text>
<text class="sb" x="600" y="326" font-size="14" fill="#64748b" letter-spacing="1">21 · Fachinformatiker in Ausbildung · DE / RU / EN</text>
