<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" role="img" aria-label="Alex – GigaOaxl">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
  </defs>
  <style>
    .o{transform-origin:1000px 150px;animation:s 24s linear infinite}
    .o2{transform-origin:1000px 150px;animation:s 40s linear infinite reverse}
    .f{stroke-dasharray:6 10;animation:d 1.6s linear infinite}
    .a{animation:r 1s both ease-out}.b{animation:r 1s .3s both ease-out}.c{animation:r 1s .6s both ease-out}
    .cur{animation:bl 1s steps(1) infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    @keyframes d{to{stroke-dashoffset:-32}}
    @keyframes r{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes bl{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="300" fill="url(#bg)"/><rect width="1200" height="300" fill="url(#g)"/>
  <circle cx="1000" cy="150" r="70" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-dasharray="2 8"/>
  <circle cx="1000" cy="150" r="115" fill="none" stroke="#38bdf8" stroke-opacity=".25" stroke-dasharray="2 10"/>
  <g class="o"><g stroke="#38bdf8" stroke-opacity=".7" class="f"><line x1="1000" y1="150" x2="1000" y2="80"/><line x1="1000" y1="150" x2="1061" y2="185"/><line x1="1000" y1="150" x2="939" y2="185"/></g>
    <circle cx="1000" cy="80" r="8" fill="#38bdf8"/><circle cx="1061" cy="185" r="8" fill="#818cf8"/><circle cx="939" cy="185" r="8" fill="#34d399"/></g>
  <g class="o2"><g stroke="#94a3b8" stroke-opacity=".5" class="f"><line x1="1000" y1="150" x2="1115" y2="150"/><line x1="1000" y1="150" x2="942" y2="50"/></g>
    <circle cx="1115" cy="150" r="6" fill="#e2e8f0"/><circle cx="942" cy="50" r="6" fill="#fbbf24"/></g>
  <circle cx="1000" cy="150" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  <g font-family="Inter,'Segoe UI',system-ui,sans-serif">
    <text x="70" y="100" fill="#38bdf8" font-size="14" font-weight="600" letter-spacing="4" class="a">HI, ICH BIN</text>
    <text x="70" y="175" fill="url(#t)" font-size="72" font-weight="800" class="b">Alex</text>
    <text x="72" y="228" fill="#94a3b8" font-size="22" class="c">Ich baue meinen Homeserver — und alles, was darauf läuft.<tspan class="cur" fill="#38bdf8"> ▍</tspan></text>
  </g>
  <rect y="296" width="1200" height="4" fill="#38bdf8" opacity=".6"/>
</svg>
