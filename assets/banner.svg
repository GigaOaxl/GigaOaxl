<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Alex – ruhig bauen, unruhig denken">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#0f172a"/></linearGradient></defs>
<style>
.w{fill:none;stroke:#38bdf8;stroke-opacity:.16;stroke-width:1.2;animation:sway 9s ease-in-out infinite}
.w1{animation-delay:-2s;stroke-opacity:.12}.w2{animation-delay:-4s;stroke-opacity:.10}.w3{animation-delay:-6s;stroke-opacity:.08}.w4{animation-delay:-8s;stroke-opacity:.06}
.p{fill:#38bdf8;opacity:.5;animation:drift 14s ease-in-out infinite}
.p1{animation-duration:9s;fill:#e2e8f0;opacity:.35}.p2{animation-duration:19s}.p3{animation-duration:6s;opacity:.7}
.scan{animation:scan 7s linear infinite}
.n{animation:fade 1.4s ease-out both}.m{animation:fade 1.4s .5s ease-out both}
.ghost{animation:jitter 5s steps(1) infinite}
@keyframes sway{50%{transform:translateY(14px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}25%{transform:translate(14px,-18px)}50%{transform:translate(-10px,-6px)}75%{transform:translate(8px,16px)}}
@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(360px)}}
@keyframes fade{from{opacity:0;letter-spacing:.3em}to{opacity:1}}
@keyframes jitter{0%,92%,100%{transform:translate(0,0);opacity:0}93%{transform:translate(-4px,1px);opacity:.55}95%{transform:translate(5px,-2px);opacity:.4}97%{transform:translate(-2px,0);opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
